# Postgres dev. PostgreSQL 18 đổi vị trí dữ liệu: mount vào /var/lib/postgresql (không phải /data).
services:
  postgres:
    image: postgres:18
    container_name: salesmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salesmind
      POSTGRES_PASSWORD: salesmind
      POSTGRES_DB: salesmind
    ports:
      # 5433 để không đụng PostgreSQL cài sẵn trên máy (thường chiếm 5432).
      - "5433:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesmind -d salesmind"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API + giao diện trong một container. Chỉ chạy khi bật profile "app":
  #   docker compose --profile app up -d --build
  # Cấu hình ở backend/.env.docker (sao chép từ backend/.env.docker.example; file này không được commit).
  app:
    profiles: ["app"]
    build: .
    image: salesmind
    container_name: salesmind-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: backend/.env.docker
    environment:
      # Trong mạng compose, Postgres ở cổng 5432 với tên máy "postgres".
      DATABASE_URL: postgres://salesmind:salesmind@postgres:5432/salesmind
    ports:
      - "127.0.0.1:3000:3000"
