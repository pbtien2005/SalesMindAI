# Postgres dev. PostgreSQL 18 đổi vị trí dữ liệu: mount vào /var/lib/postgresql (không phải /data).
services:
  postgres:
    image: postgres:18
    container_name: salesmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: salesmind
      POSTGRES_PASSWORD: salesmind
      POSTGRES_DB: salesmind
    ports:
      # 5433 để không đụng PostgreSQL cài sẵn trên máy (thường chiếm 5432).
      - "5433:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesmind -d salesmind"]
      interval: 5s
      timeout: 3s
      retries: 10
